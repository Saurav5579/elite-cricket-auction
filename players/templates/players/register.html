{% extends "players/base.html" %}

{% block content %}

<div class="form-wrapper">

  <div class="form-header">

    <h2 class="page-title">🏏 Player Registration</h2>

    <p class="page-subtitle">
      Fill the details below to enter the Elite Auction Pool.
    </p>

  </div>

  <!-- Error Message -->
  {% if error %}
  <div style="background:#ffefef; color:#b30000; padding:10px; border-radius:6px; margin-bottom:15px; font-weight:600;">
      {{ error }}
  </div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data" class="form-box">

    {% csrf_token %}

    <div class="form-fields">
      {{ form.as_p }}
    </div>

    <!-- File upload instructions -->
    <div style="font-size:13px; color:#666; margin-top:10px; margin-bottom:10px;">
      📷 Photo must be <b>JPG format (10KB – 20KB)</b><br>
      📄 Document must be <b>50KB – 500KB</b>
    </div>

    <button type="submit" class="submit-btn">
      ✅ Register Player
    </button>

  </form>

</div>

<style>
body{

  background:
    radial-gradient(circle at 20% 30%, rgba(56,189,248,0.25), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(37,99,235,0.25), transparent 45%),
    linear-gradient(135deg,#020617,#020617 40%,#020617 60%);

  background-attachment:fixed;
  min-height:100vh;

}

body::before{

  content:"";
  position:fixed;
  inset:0;

  background:

    radial-gradient(circle at 70% 20%, rgba(0,150,255,.15), transparent 40%),
    radial-gradient(circle at 10% 80%, rgba(99,102,241,.12), transparent 40%);

  pointer-events:none;
  z-index:-1;

}

/* =========================
   BACKGROUND GLOW
========================= */

.form-wrapper{

  max-width:720px;
  margin:40px auto 40px;
  padding:20px;
  position:relative;

}

.form-wrapper:before{

  content:"";
  position:absolute;
  inset:-80px;

  background:
    radial-gradient(circle at 30% 30%, rgba(56,189,248,.18), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(99,102,241,.15), transparent 60%);

  filter:blur(60px);
  z-index:-1;

}


/* =========================
   HEADER
========================= */

.form-header{
  text-align:center;
  margin-bottom:30px;
}

.page-title{

  font-size:34px;
  font-weight:900;
  color:#ffffff;

  letter-spacing:.5px;

  text-shadow:
    0 0 10px rgba(56,189,248,.7),
    0 0 25px rgba(56,189,248,.3);

}

.page-subtitle{

  margin-top:8px;

  color:#cbd5f1;
  font-size:15px;

  opacity:.9;

}


/* =========================
   PREMIUM FORM CARD
========================= */

.form-box{

  background:rgba(255,255,255,.94);

  padding:34px 34px;

  border-radius:20px;

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,.35);

  box-shadow:
    0 35px 90px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(56,189,248,.12);

  transition:.35s;

}

.form-box:hover{

  transform:translateY(-3px);

  box-shadow:
    0 50px 120px rgba(0,0,0,.7);

}


/* =========================
   FORM SPACING
========================= */

.form-fields p{
  margin-bottom:16px;
}


/* =========================
   LABELS
========================= */

.form-box label{

  font-weight:700;
  font-size:14px;

  color:#0f172a;

  display:block;

}


/* =========================
   INPUT FIELDS
========================= */

.form-box input,
.form-box select,
.form-box textarea{

  width:100%;

  padding:11px 13px;
  margin-top:6px;

  border-radius:10px;

  border:1px solid #cbd5f1;

  font-size:14px;

  transition:.25s;

  background:white;

}


/* =========================
   INPUT FOCUS GLOW
========================= */

.form-box input:focus,
.form-box select:focus,
.form-box textarea:focus{

  outline:none;

  border-color:#38bdf8;

  box-shadow:
    0 0 0 3px rgba(56,189,248,.25),
    0 6px 18px rgba(56,189,248,.25);

}


/* =========================
   FILE INPUT STYLE
========================= */

input[type="file"]{

  padding:8px;
  background:#f8fafc;

}


/* =========================
   TERMS CHECKBOX FIX
========================= */

.form-box p:has(input[type="checkbox"]){

  display:flex;
  align-items:center;
  gap:8px;

}

.form-box input[type="checkbox"]{

  width:18px;
  height:18px;

  margin-top:0;

}

.form-box p:has(input[type="checkbox"]) label{

  margin:0;
  font-weight:600;

}

/* =========================
   SUBMIT BUTTON
========================= */

.submit-btn{

  width:100%;
  margin-top:22px;

  padding:15px;

  font-size:17px;
  font-weight:900;

  border-radius:14px;

  border:none;

  color:white;

  background:
    linear-gradient(135deg,#0ea5e9,#2563eb);

  box-shadow:
    0 18px 45px rgba(37,99,235,.5),
    inset 0 0 10px rgba(255,255,255,.2);

  cursor:pointer;

  transition:.3s;

}

.submit-btn:hover{

  transform:translateY(-4px) scale(1.03);

  box-shadow:
    0 28px 70px rgba(37,99,235,.7);

}

.submit-btn:active{

  transform:scale(.98);

}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

  .form-box{
    padding:24px;
  }

  .page-title{
    font-size:28px;
  }

}
/* =========================
🏏 REGISTRATION FORM
========================= */

.form-container{

max-width:700px;
margin:60px auto;
padding:40px;

background:rgba(255,255,255,0.05);
border-radius:18px;

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.08);

box-shadow:0 10px 40px rgba(0,0,0,.6);
}

/* form title */

.form-title{
font-size:32px;
font-weight:900;
text-align:center;
margin-bottom:25px;
}

/* labels */

.form-container label{
display:block;
margin-bottom:6px;
font-weight:700;
color:#e2e8f0;
}

/* inputs */

.form-container input,
.form-container select,
.form-container textarea{

width:100%;
padding:12px 14px;

border-radius:10px;

border:1px solid rgba(255,255,255,.15);

background:#020617;

color:#e5e7eb;

font-size:15px;

margin-bottom:18px;

outline:none;

transition:.25s;
}

/* focus effect */

.form-container input:focus,
.form-container select:focus,
.form-container textarea:focus{

border-color:#38bdf8;

box-shadow:0 0 8px rgba(56,189,248,.5);
}

/* submit button */

.form-container button{

width:100%;
padding:14px;

border:none;

border-radius:12px;

font-size:16px;
font-weight:800;

background:linear-gradient(135deg,#0ea5e9,#2563eb);

color:white;

cursor:pointer;

transition:.3s;
}

.form-container button:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(0,0,0,.6);
}
/* =========================
📱 MOBILE
========================= */

@media(max-width:768px){

.form-container{

margin:40px 15px;
padding:25px;

}

.form-title{
font-size:26px;
}

.form-container input,
.form-container select,
.form-container textarea{

font-size:14px;
padding:10px 12px;

}

}


/* =========================
📱 SMALL MOBILE
========================= */

@media(max-width:480px){

.form-container{

margin:30px 12px;
padding:20px;

}

.form-title{
font-size:22px;
}

.form-container button{
font-size:15px;
padding:12px;
}

}
/* ===== INPUT TEXT FIX ===== */

input,
select,
textarea {
    color: #111 !important;
    opacity: 1 !important;
    font-weight: 500;
}

/* ===== PLACEHOLDER ===== */

input::placeholder {
    color: #777;
    opacity: 1;
}

/* ===== FOCUS ===== */

input:focus,
select:focus,
textarea:focus {
    color: #111 !important;
    background: #fff;
}

/* ===== FILE INPUT ===== */

input[type="file"] {
    color: #111;
    font-weight: 500;
}

/* ===== REQUIRED FIELD ===== */

input:required,
select:required {
    border: 2px solid #cbd5e1;
}

/* ===== INVALID FIELD ===== */

input:invalid,
select:invalid {
    border: 2px solid #ff3b3b;
}

/* ===== DJANGO ERROR MESSAGE FIX ===== */

.errorlist {
    list-style: none;
    padding: 0;
    margin: 5px 0 10px 0;
}

.errorlist li {
    color: #ff3b3b !important;
    font-weight: 600;
    font-size: 14px;
    opacity: 1 !important;
}

/* ===== FIELD ERROR HIGHLIGHT ===== */

.error-field {
    border: 2px solid #ff3b3b !important;
    box-shadow: 0 0 5px rgba(255,0,0,0.4);
}

/* ===== CUSTOM ERROR TEXT ===== */

.error-text {
    color: #ff3b3b;
    font-size: 13px;
    margin-top: 3px;
    font-weight: 500;
}
</style>
<script>
document.querySelector("form").addEventListener("submit", function(e){

    let inputs = document.querySelectorAll("input, select");
    let valid = true;

    inputs.forEach(function(input){

        input.classList.remove("error-field");

        if(input.hasAttribute("required") && input.value.trim() === ""){
            input.classList.add("error-field");
            valid = false;
        }

    });

    if(!valid){
        e.preventDefault();
    }

});
</script>
{% endblock %}
